<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkle Bay Car Wash</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#073D7F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sparkle Bay">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="48x48" href="../icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#F1F1F1; font-family:system-ui,Arial,sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#F1F1F1; }
  body.hasbar iframe { top:46px; height:calc(100% - 46px); }
  #install { position:fixed; top:0; left:0; right:0; height:46px; z-index:3; background:#073D7F; color:#fff; display:flex; align-items:center; gap:10px; padding:0 10px 0 14px; font-size:14px; }
  #install[hidden] { display:none; }
  #install span { flex:1; line-height:1.2; }
  #install button { border:0; border-radius:8px; padding:8px 14px; font-size:14px; font-weight:700; cursor:pointer; background:#6491DE; color:#fff; }
  #install #ix { background:transparent; font-size:22px; padding:4px 8px; }
  #splash { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; z-index:2; transition:opacity .3s; text-align:center; padding:24px; }
  #splash img { width:150px; height:150px; border-radius:28px; }
  #splash p { margin:16px 0 0; font-size:15px; opacity:.85; }
  #splash a { color:#6491DE; }
  #help { display:none; }
</style>
</head>
<body>
<div id="install" hidden><span id="itext"></span><button id="ibtn" type="button">Install</button><button id="ix" type="button" aria-label="Close">&times;</button></div>
<div id="splash"><img src="../icons/icon-192.png" alt="Sparkle Bay"><p id="msg">Loading...</p><p id="help">Taking long? <a id="direct" href="#">Open directly</a></p></div>
<iframe id="app" title="Sparkle Bay Car Wash"></iframe>
<script src="../config.js"></script>
<script>
(function () {
  var MODE = 'client', WHO = 'customer', KEY = 'sb-dismiss-' + MODE;
  var bar = document.getElementById('install'), itext = document.getElementById('itext'), ibtn = document.getElementById('ibtn'), deferred = null;
  var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  function dismissed() { try { return sessionStorage.getItem(KEY) === '1'; } catch (e) { return false; } }
  function showBar(text, canInstall) {
    if (standalone || dismissed()) return;
    itext.textContent = text; ibtn.style.display = canInstall ? '' : 'none';
    bar.hidden = false; document.body.classList.add('hasbar');
  }
  function hideBar() { bar.hidden = true; document.body.classList.remove('hasbar'); }
  if (!standalone) {
    window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; showBar('Install the ' + WHO + ' app on your phone', true); });
    window.addEventListener('appinstalled', hideBar);
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) showBar('To install: tap Share, then Add to Home Screen', false);
  }
  ibtn.onclick = function () { if (!deferred) return; deferred.prompt(); deferred.userChoice.then(function () { deferred = null; hideBar(); }); };
  document.getElementById('ix').onclick = function () { hideBar(); try { sessionStorage.setItem(KEY, '1'); } catch (e) {} };

  var base = (window.SPARKLE || {}).APP_URL || '';
  var splash = document.getElementById('splash'), msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\//.test(base)) {
    msg.textContent = 'Setup not finished: open config.js and paste your Apps Script web app address.';
    return;
  }
  var url = MODE === 'client' ? base + (base.indexOf('?') > -1 ? '&' : '?') + 'mode=client' : base;
  document.getElementById('direct').href = url;
  if (/[?&]direct=1/.test(location.search)) { location.replace(url); return; }
  var frame = document.getElementById('app');
  frame.onload = function () { splash.style.opacity = 0; setTimeout(function () { splash.style.display = 'none'; }, 350); };
  setTimeout(function () { document.getElementById('help').style.display = 'block'; }, 9000);
  frame.src = url;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
