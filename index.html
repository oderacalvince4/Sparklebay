<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sparkle Bay Car Wash</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#073D7F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sparkle Bay">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#F1F1F1; font-family:system-ui,Arial,sans-serif; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#F1F1F1; }
  #splash { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; color:#fff; z-index:2; transition:opacity .3s; text-align:center; padding:24px; }
  #splash img { width:150px; height:150px; border-radius:28px; }
  #splash p { margin:16px 0 0; font-size:15px; opacity:.85; }
  #splash a { color:#6491DE; }
  #help { display:none; }
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt="Sparkle Bay"><p id="msg">Loading...</p><p id="help">Taking long? <a id="direct" href="#">Open directly</a></p></div>
<iframe id="app" title="Sparkle Bay Car Wash"></iframe>
<script src="config.js"></script>
<script>
(function () {
  var MODE = 'client';
  var base = (window.SPARKLE || {}).APP_URL || '';
  var splash = document.getElementById('splash'), msg = document.getElementById('msg');
  if (!/^https:\/\/script\.google\.com\//.test(base)) {
    msg.textContent = 'Setup not finished: open config.js and paste your Apps Script web app address.';
    return;
  }
  var url = MODE === 'client' ? base + (base.indexOf('?') > -1 ? '&' : '?') + 'mode=client' : base;
  document.getElementById('direct').href = url;
  if (/[?&]direct=1/.test(location.search)) { location.replace(url); return; }
  var frame = document.getElementById('app');
  frame.onload = function () { splash.style.opacity = 0; setTimeout(function () { splash.style.display = 'none'; }, 350); };
  setTimeout(function () { document.getElementById('help').style.display = 'block'; }, 9000);
  frame.src = url;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
